spring:
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      image:
        options:
          model: gpt-image-1
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
