plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'me.seonkyukim.springdeveloper'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone'}
}

dependencies {
	   implementation 'org.springframework.boot:spring-boot-starter-web'
	   implementation 'org.springframework.boot:spring-boot-starter'
	   testImplementation 'org.springframework.boot:spring-boot-starter-test'
	   testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	   
	   implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	   runtimeOnly   'com.h2database:h2'
		compileOnly 'org.projectlombok:lombok:1.18.30'
		annotationProcessor 'org.projectlombok:lombok:1.18.30'
	   
	   implementation 'org.springframework.boot:spring-boot-h2console'
	   implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	   
	   // openai 의존성 다운로드
	   implementation platform('org.springframework.ai:spring-ai-bom:2.0.0-M1')
	   implementation 'org.springframework.ai:spring-ai-starter-model-openai' 
	   
	   implementation 'org.springframework.boot:spring-boot-starter-security'
	   implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	  // testimplementation 'org.springframework.security:spring-security-test'
	  
	  // JWT 웹토큰관련
	  testAnnotationProcessor 'org.projectlombok:lombok'
	  testImplementation 'org.projectlombok:lombok'
	  implementation 'io.jsonwebtoken:jjwt:0.9.1' // JAVA JWT 라이브러리
	  implementation 'javax.xml.bind:jaxb-api:2.3.1' // XML 과 Java 객체간 매핑 자동화
}

tasks.named('test') {
	useJUnitPlatform()
}
